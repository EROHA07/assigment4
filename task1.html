
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - HTML5 Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container page">
    <div class="form-box">

        <a href="index.html" class="back-link">← Back to Home</a>

        <br>
        <span class="task-badge">Task 1 - HTML5 Validation</span>

        <h2>Contact Form</h2>
        <p class="subtitle">Please complete all required fields.</p>

        <form class="basic-form" onsubmit="event.preventDefault()">

            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name"
                   required minlength="2" maxlength="50">

            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email"
                   placeholder="example@gmail.com" required>

            <label for="message">Your Message *</label>
            <textarea id="message" name="message" rows="5"
                      placeholder="Write at least 5 characters..."
                      required minlength="5" maxlength="500"></textarea>

            <button type="submit">Send Message</button>

        </form>
    </div>
</div>

</body>
</html>
