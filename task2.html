
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Bootstrap Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container page">
    <div class="form-box">

        <a href="index.html" class="back-link">← Back to Home</a>

        <br>
        <span class="task-badge">Task 2 - Bootstrap Forms</span>

        <h2>Contact Us</h2>
        <p class="subtitle">Fill in the form below.</p>

        <form class="row g-3" onsubmit="event.preventDefault()">

            <div class="col-md-6">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control"
                       placeholder="Your name">
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control"
                       placeholder="example@gmail.com">
                <div class="form-text">
                    We will not share your email.
                </div>
            </div>

            <div class="col-12">
                <label for="message" class="form-label">Your Message</label>
                <textarea id="message" class="form-control"
                          rows="5" placeholder="Write your message..."></textarea>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">
                    Send Message
                </button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
